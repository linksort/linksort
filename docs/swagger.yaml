basePath: /api
consumes:
- application/json
definitions:
  agent.ToolUse:
    properties:
      id:
        type: string
      name:
        type: string
      request:
        $ref: '#/definitions/agent.ToolUseRequest'
      response:
        $ref: '#/definitions/agent.ToolUseResponse'
      type:
        allOf:
        - $ref: '#/definitions/agent.ToolUseType'
        description: |-
          If ToolUseType is "request", then the Request field must be populated.
          If ToolUseType is "response", then the Response field must be populated.
    type: object
  agent.ToolUseRequest:
    properties:
      text:
        type: string
    type: object
  agent.ToolUseResponse:
    properties:
      status:
        $ref: '#/definitions/agent.ToolUseStatus'
      text:
        type: string
    type: object
  agent.ToolUseStatus:
    enum:
    - success
    - error
    type: string
    x-enum-varnames:
    - ToolUseStatusSuccess
    - ToolUseStatusError
  agent.ToolUseType:
    enum:
    - request
    - response
    type: string
    x-enum-varnames:
    - ToolUseTypeRequest
    - ToolUseTypeResponse
  conversation.ConverseRequest:
    properties:
      message:
        description: The message to send in the conversation. Required unless a trigger
          is set.
        type: string
      pageContext:
        allOf:
        - $ref: '#/definitions/conversation.PageContext'
        description: The page context where the user is sending the message from
      trigger:
        description: |-
          Trigger starts a synthetic turn instead of a typed message. The only
          supported value is "link_review", which is only valid on a fresh
          conversation whose kind is "link_review".
        enum:
        - link_review
        type: string
    type: object
  conversation.CreateConversationRequest:
    type: object
  conversation.CreateConversationResponse:
    properties:
      conversation:
        $ref: '#/definitions/model.Conversation'
    type: object
  conversation.GetConversationResponse:
    properties:
      conversation:
        $ref: '#/definitions/model.Conversation'
    type: object
  conversation.GetConversationsResponse:
    properties:
      conversations:
        items:
          $ref: '#/definitions/model.Conversation'
        type: array
    type: object
  conversation.PageContext:
    properties:
      query:
        additionalProperties:
          type: string
        type: object
      route:
        type: string
    type: object
  conversation.StartLinkReviewResponse:
    properties:
      conversation:
        $ref: '#/definitions/model.Conversation'
      newLinkCount:
        type: integer
    type: object
  folder.CreateFolderRequest:
    properties:
      name:
        maxLength: 128
        type: string
      parentId:
        type: string
    required:
    - name
    type: object
  folder.CreateFolderResponse:
    properties:
      user:
        $ref: '#/definitions/model.User'
    type: object
  folder.DeleteFolderResponse:
    properties:
      user:
        $ref: '#/definitions/model.User'
    type: object
  folder.UpdateFolderRequest:
    properties:
      name:
        maxLength: 128
        type: string
      parentId:
        type: string
    required:
    - name
    type: object
  folder.UpdateFolderResponse:
    properties:
      user:
        $ref: '#/definitions/model.User'
    type: object
  link.CreateHighlightRequest:
    properties:
      end:
        minimum: 0
        type: integer
      exact:
        maxLength: 2000
        type: string
      note:
        maxLength: 10000
        type: string
      prefix:
        maxLength: 64
        type: string
      start:
        minimum: 0
        type: integer
      suffix:
        maxLength: 64
        type: string
    required:
    - exact
    type: object
  link.CreateLinkRequest:
    properties:
      corpus:
        maxLength: 500000
        type: string
      description:
        maxLength: 2048
        type: string
      favicon:
        maxLength: 512
        type: string
      image:
        maxLength: 512
        type: string
      site:
        maxLength: 512
        type: string
      title:
        maxLength: 512
        type: string
      url:
        maxLength: 2048
        type: string
    required:
    - url
    type: object
  link.CreateLinkResponse:
    properties:
      link:
        $ref: '#/definitions/model.Link'
      user:
        $ref: '#/definitions/model.User'
    type: object
  link.DeleteLinkResponse:
    properties:
      user:
        $ref: '#/definitions/model.User'
    type: object
  link.GetLinkResponse:
    properties:
      link:
        $ref: '#/definitions/model.Link'
    type: object
  link.GetLinksResponse:
    properties:
      links:
        items:
          $ref: '#/definitions/model.Link'
        type: array
    type: object
  link.HighlightResponse:
    properties:
      link:
        $ref: '#/definitions/model.Link'
    type: object
  link.SummarizeLinkResponse:
    properties:
      link:
        $ref: '#/definitions/model.Link'
    type: object
  link.UpdateHighlightRequest:
    properties:
      note:
        maxLength: 10000
        type: string
    type: object
  link.UpdateLinkRequest:
    properties:
      annotation:
        type: string
      description:
        maxLength: 2048
        type: string
      favicon:
        maxLength: 512
        type: string
      folderId:
        type: string
      image:
        maxLength: 512
        type: string
      isFavorite:
        type: boolean
      site:
        maxLength: 512
        type: string
      title:
        maxLength: 512
        type: string
      url:
        maxLength: 2048
        type: string
      userTags:
        items:
          type: string
        type: array
    type: object
  link.UpdateLinkResponse:
    properties:
      link:
        $ref: '#/definitions/model.Link'
      user:
        $ref: '#/definitions/model.User'
    type: object
  model.Conversation:
    properties:
      createdAt:
        type: string
      id:
        type: string
      kind:
        type: string
      length:
        type: integer
      messages:
        items:
          $ref: '#/definitions/model.Message'
        type: array
      reviewSince:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  model.ConverseEvent:
    properties:
      textDelta:
        type: string
      toolUseDelta:
        $ref: '#/definitions/model.ToolUseDelta'
    type: object
  model.Folder:
    properties:
      children:
        items:
          $ref: '#/definitions/model.Folder'
        type: array
      id:
        type: string
      name:
        type: string
    type: object
  model.Highlight:
    properties:
      createdAt:
        type: string
      end:
        type: integer
      exact:
        type: string
      id:
        type: string
      note:
        type: string
      prefix:
        type: string
      start:
        type: integer
      suffix:
        type: string
      updatedAt:
        type: string
    type: object
  model.Link:
    properties:
      annotation:
        type: string
      corpus:
        type: string
      createdAt:
        type: string
      description:
        type: string
      favicon:
        type: string
      folderId:
        type: string
      highlights:
        items:
          $ref: '#/definitions/model.Highlight'
        type: array
      id:
        type: string
      image:
        type: string
      isAnnotated:
        type: boolean
      isArticle:
        type: boolean
      isFavorite:
        type: boolean
      isSummarized:
        type: boolean
      site:
        type: string
      summary:
        type: string
      tagDetails:
        items:
          $ref: '#/definitions/model.TagDetail'
        type: array
      tagPaths:
        items:
          type: string
        type: array
      title:
        type: string
      updatedAt:
        type: string
      url:
        type: string
      userId:
        type: string
      userTags:
        items:
          type: string
        type: array
    type: object
  model.Message:
    properties:
      createdAt:
        type: string
      id:
        type: string
      isToolUse:
        type: boolean
      kind:
        type: string
      pageContext:
        additionalProperties: {}
        type: object
      role:
        enum:
        - user
        - assistant
        type: string
      sequenceNumber:
        type: integer
      toolUse:
        items:
          $ref: '#/definitions/agent.ToolUse'
        type: array
    required:
    - role
    type: object
  model.TagDetail:
    properties:
      confidence:
        type: number
      name:
        type: string
      path:
        type: string
    type: object
  model.TagNode:
    properties:
      children:
        items:
          $ref: '#/definitions/model.TagNode'
        type: array
      count:
        type: integer
      name:
        type: string
      path:
        type: string
    type: object
  model.ToolUseDelta:
    properties:
      id:
        type: string
      name:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  model.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      folderTree:
        $ref: '#/definitions/model.Folder'
      hasSeenWelcomeTour:
        type: boolean
      id:
        type: string
      lastLinkReviewAt:
        type: string
      lastName:
        type: string
      tagTree:
        $ref: '#/definitions/model.TagNode'
      token:
        type: string
      updatedAt:
        type: string
      userTags:
        $ref: '#/definitions/model.UserTags'
    type: object
  model.UserTags:
    additionalProperties:
      type: integer
    type: object
  payload.Error:
    properties:
      message:
        type: string
    type: object
  user.GetUserResponse:
    properties:
      user:
        $ref: '#/definitions/model.User'
    type: object
  user.ImportPocketResponse:
    properties:
      imported:
        type: integer
    type: object
host: linksort.com
info:
  contact:
    email: alex@linksort.com
    name: Linksort Support
    url: https://linksort.com
  description: Linksort API documentation
  license:
    name: Copyright (c) 2023 Linksort
    url: https://github.com/linksort/linksort/blob/main/LICENSE
  termsOfService: https://linksort.com/terms
  title: Linksort API
  version: "1.0"
paths:
  /conversations:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/conversation.GetConversationsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: GetConversations
    post:
      parameters:
      - description: Create a new conversation
        in: body
        name: CreateConversationRequest
        required: true
        schema:
          $ref: '#/definitions/conversation.CreateConversationRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/conversation.CreateConversationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: CreateConversation
  /conversations/{id}:
    get:
      parameters:
      - description: ConversationID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/conversation.GetConversationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: GetConversation
  /conversations/{id}/converse:
    put:
      parameters:
      - description: ConversationID
        in: path
        name: id
        required: true
        type: string
      - description: Message to send in the conversation
        in: body
        name: ConverseRequest
        required: true
        schema:
          $ref: '#/definitions/conversation.ConverseRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ConverseEvent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: Converse in an existing conversation
  /conversations/review:
    post:
      description: Starts an automatic review of the links saved since the user's
        last review. Responds 204 when the user is not eligible (fewer than 3 new
        links or last review less than 4 hours ago).
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/conversation.StartLinkReviewResponse'
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: StartLinkReview
  /folders:
    post:
      parameters:
      - description: Only 'name' is required. Use 'parentId' to nest the new folder
          under a parent folder.
        in: body
        name: CreateFolderRequest
        required: true
        schema:
          $ref: '#/definitions/folder.CreateFolderRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/folder.CreateFolderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: CreateFolder
  /folders/{id}:
    delete:
      parameters:
      - description: FolderID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/folder.DeleteFolderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: DeleteFolder
    patch:
      parameters:
      - description: FolderID
        in: path
        name: id
        required: true
        type: string
      - description: Change the folder's name or move the folder under a new parent
          folder. Set the parentId to 'root' to move the folder to the top level.
        in: body
        name: UpdateFolderRequest
        required: true
        schema:
          $ref: '#/definitions/folder.UpdateFolderRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/folder.UpdateFolderResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: UpdateFolder
  /links:
    get:
      description: Gets a list of links with filters applied through the available
        query parameters.
      parameters:
      - description: Sort, descending or ascending
        enum:
        - "1"
        - "-1"
        in: query
        name: sort
        type: string
      - description: Search
        in: query
        name: search
        type: string
      - description: Only return favorites
        enum:
        - "0"
        - "1"
        in: query
        name: favorite
        type: string
      - description: Only return links with annotations
        enum:
        - "0"
        - "1"
        in: query
        name: annotated
        type: string
      - description: Only return links from the given folder ID
        in: query
        name: folder
        type: string
      - description: Only return links with the given tag path
        in: query
        name: tag
        type: string
      - description: Only return links with the given user tag
        in: query
        name: usertag
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        maximum: 1000
        name: size
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/link.GetLinksResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: GetLinks
    post:
      description: Creates a link. Both the new link and the user are returned so
        that newly created tags can be seen.
      parameters:
      - description: All fields are optional except 'url'.
        in: body
        name: CreateLinkRequest
        required: true
        schema:
          $ref: '#/definitions/link.CreateLinkRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/link.CreateLinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: CreateLink
  /links/{id}:
    delete:
      parameters:
      - description: LinkID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/link.DeleteLinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: DeleteLink
    get:
      description: Gets a link with all fields populated.
      parameters:
      - description: LinkID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/link.GetLinkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: GetLink
    patch:
      parameters:
      - description: LinkID
        in: path
        name: id
        required: true
        type: string
      - description: All fields are optional.
        in: body
        name: UpdateLinkRequest
        required: true
        schema:
          $ref: '#/definitions/link.UpdateLinkRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/link.UpdateLinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: UpdateLink
  /links/{id}/highlights:
    post:
      description: Adds a highlight to a link. A highlight is anchored by a text quote
        ('exact' plus up to 64 characters of 'prefix' and 'suffix' context; 'start'/'end'
        are offset hints) and may carry an optional note. The whole updated link is
        returned.
      parameters:
      - description: LinkID
        in: path
        name: id
        required: true
        type: string
      - description: Only 'exact' is required.
        in: body
        name: CreateHighlightRequest
        required: true
        schema:
          $ref: '#/definitions/link.CreateHighlightRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/link.HighlightResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: CreateHighlight
  /links/{id}/highlights/{highlightId}:
    delete:
      description: Removes a highlight and returns the whole updated link.
      parameters:
      - description: LinkID
        in: path
        name: id
        required: true
        type: string
      - description: HighlightID
        in: path
        name: highlightId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/link.HighlightResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: DeleteHighlight
    patch:
      description: Updates the note on a highlight and returns the whole updated link.
      parameters:
      - description: LinkID
        in: path
        name: id
        required: true
        type: string
      - description: HighlightID
        in: path
        name: highlightId
        required: true
        type: string
      - description: The new note.
        in: body
        name: UpdateHighlightRequest
        required: true
        schema:
          $ref: '#/definitions/link.UpdateHighlightRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/link.HighlightResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/payload.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/payload.Error'
      security:
      - ApiKeyAuth: []
      summary: UpdateHighlight
  /links/{id}/summarize:
    post:
      description: Generates a summary of the given link's corpus and returns the
        updated link.
      parameters:
      - description: LinkID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/link.SummarizeLinkResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/payload.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/payload.Error'
        "500":
          description: Internal Server Error
          schema:
